# user-management bundle patch: contributes the plugin row into the
# host composition when this package is installed via `dsh plugin add`.
#
# The plugin is HOST-PLANE: it spins up its own node:https gateway listener
# (TLS + self-signed certs + Host allow-list) that reverse-proxies to the
# loopback dsh webserver, with its own user store as the auth (login/register
# page + /user-management/api/* served locally; everything else proxied). It
# also serves a settings-page management UI from its client half. It must land
# in the host composition (this insert), never inside an agent preset.

- insert:
    - id: user-management
      name: '@weibaohui/user-management'
